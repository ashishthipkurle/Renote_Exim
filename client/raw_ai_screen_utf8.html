<script data-purpose="editor-logic">
    const cropBtn = document.getElementById('crop-tool-btn');
    const cropOverlay = document.getElementById('crop-overlay');
    let isCropping = false;
    cropBtn.addEventListener('click', () => {
        isCropping = !isCropping;
        if (isCropping) {
            cropOverlay.classList.remove('opacity-0');
            cropOverlay.classList.add('opacity-100');
            cropBtn.classList.add('bg-corporate-blue', 'text-white');
            cropBtn.classList.remove('bg-accent-blue-light', 'text-corporate-blue');
        } else {
            cropOverlay.classList.remove('opacity-100');
            cropOverlay.classList.add('opacity-0');
            cropBtn.classList.remove('bg-corporate-blue', 'text-white');
            cropBtn.classList.add('bg-accent-blue-light', 'text-corporate-blue');
        }
    });
</script>
