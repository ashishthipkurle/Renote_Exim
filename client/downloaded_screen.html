<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ExportCo Portal | Cinematic Entrance</title>
<!-- BEGIN: Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<!-- END: Google Fonts -->
<!-- BEGIN: Scripts (Tailwind & GSAP) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            anton: ['Anton', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            'portal-dark': '#050a14',
            'portal-blue': '#0a192f',
          }
        }
      }
    }
  </script>
<!-- END: Scripts -->
<style data-purpose="cinematic-layout">
    body {
      margin: 0;
      overflow: hidden; /* Prevent scrolling during animation */
      background-color: #050a14;
    }

    .shutter-panel {
      position: fixed;
      left: 0;
      width: 100%;
      height: 50.5%; /* Slight overlap to prevent seam lines */
      background-color: #000;
      z-index: 100;
    }

    .shutter-top { top: 0; }
    .shutter-bottom { bottom: 0; }

    .text-reveal-mask {
      overflow: hidden;
      display: inline-block;
    }

    .main-dashboard {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body class="bg-portal-dark font-inter text-white">
<!-- BEGIN: Cinematic Preloader Overlay -->
<div class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-transparent pointer-events-none" id="preloader">
<!-- Shutters -->
<div class="shutter-panel shutter-top" id="shutter-top"></div>
<div class="shutter-panel shutter-bottom" id="shutter-bottom"></div>
<!-- Text Container -->
<div class="relative z-[101] text-center" data-purpose="loading-text-container">
<div class="flex flex-col md:flex-row items-center gap-4 md:gap-8">
<!-- ENTERING -->
<div class="text-reveal-mask">
<h1 class="text-reveal-item font-anton text-4xl md:text-7xl tracking-widest text-gray-400 opacity-0 translate-y-full">ENTERING</h1>
</div>
<!-- EXPORTCO -->
<div class="text-reveal-mask">
<h1 class="text-reveal-item font-anton text-5xl md:text-8xl tracking-tight text-white border-x-4 border-white px-6 opacity-0 translate-y-full">EXPORTCO</h1>
</div>
<!-- PORTAL -->
<div class="text-reveal-mask">
<h1 class="text-reveal-item font-anton text-4xl md:text-7xl tracking-widest text-gray-400 opacity-0 translate-y-full">PORTAL</h1>
</div>
</div>
<!-- Loading Progress Bar -->
<div class="mt-12 w-48 h-px bg-gray-800 mx-auto relative overflow-hidden" id="loader-bar-container">
<div class="absolute inset-y-0 left-0 bg-white w-0" id="loader-progress"></div>
</div>
</div>
</div>
<!-- END: Cinematic Preloader Overlay -->
<!-- BEGIN: Main Dashboard Content (Initially Hidden) -->
<main class="main-dashboard min-h-screen w-full bg-gradient-to-b from-portal-dark to-portal-blue p-8 flex flex-col items-center justify-center text-center" id="dashboard">
<!-- Background subtle noise/glow -->
<div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/10 via-transparent to-transparent"></div>
<section class="relative z-10 max-w-4xl w-full">
<nav class="mb-12 flex justify-between items-center opacity-0 dashboard-element">
<div class="font-anton text-2xl tracking-tighter">EXPORTCO // SYST</div>
<div class="text-xs tracking-[0.3em] text-blue-400 uppercase">Secure Connection Established</div>
</nav>
<div class="space-y-6">
<h2 class="text-5xl md:text-7xl font-anton tracking-tighter dashboard-element opacity-0 translate-y-4">WELCOME COMMANDER</h2>
<p class="text-gray-400 max-w-lg mx-auto leading-relaxed dashboard-element opacity-0 translate-y-4">
          All systems are operational. Global logistics streams are synchronized. Your dashboard is ready for operation.
        </p>
<div class="pt-8 flex gap-4 justify-center dashboard-element opacity-0 translate-y-4">
<button class="px-8 py-3 bg-white text-black font-bold text-xs uppercase tracking-widest hover:bg-blue-500 hover:text-white transition-colors duration-300">
            Initialize View
          </button>
<button class="px-8 py-3 border border-gray-700 text-white font-bold text-xs uppercase tracking-widest hover:border-white transition-colors duration-300">
            System Logs
          </button>
</div>
</div>
<div class="mt-20 grid grid-cols-1 md:grid-cols-3 gap-6 dashboard-element opacity-0">
<div class="p-6 border border-white/5 bg-white/5 backdrop-blur-sm rounded-sm text-left">
<div class="text-blue-500 text-xs font-bold mb-2">ACTIVE FREIGHT</div>
<div class="text-3xl font-anton">1,402</div>
</div>
<div class="p-6 border border-white/5 bg-white/5 backdrop-blur-sm rounded-sm text-left">
<div class="text-blue-500 text-xs font-bold mb-2">NODES ONLINE</div>
<div class="text-3xl font-anton">98.4%</div>
</div>
<div class="p-6 border border-white/5 bg-white/5 backdrop-blur-sm rounded-sm text-left">
<div class="text-blue-500 text-xs font-bold mb-2">SECURITY STATUS</div>
<div class="text-3xl font-anton">ENCRYPTED</div>
</div>
</div>
</section>
<!-- Decorative Corner Elements -->
<div class="fixed top-4 left-4 w-12 h-12 border-t border-l border-white/20 dashboard-element opacity-0"></div>
<div class="fixed bottom-4 right-4 w-12 h-12 border-b border-r border-white/20 dashboard-element opacity-0"></div>
</main>
<!-- END: Main Dashboard Content -->
<!-- BEGIN: Animation Scripts -->
<script data-purpose="gsap-reveal-logic">
    document.addEventListener("DOMContentLoaded", () => {
      const tl = gsap.timeline({
        onComplete: () => {
          // Re-enable scrolling if necessary
          document.body.style.overflow = "auto";
        }
      });

      // 1. Initial State
      gsap.set(".main-dashboard", { visibility: "visible" });

      // 2. Text Reveal Stagger
      tl.to(".text-reveal-item", {
        opacity: 1,
        y: 0,
        duration: 1.2,
        stagger: 0.2,
        ease: "expo.out",
        delay: 0.5
      });

      // 3. Progress Bar Animation
      tl.to("#loader-progress", {
        width: "100%",
        duration: 1.5,
        ease: "power2.inOut"
      }, "-=0.5");

      // 4. Text Outro
      tl.to(".text-reveal-item", {
        y: -100,
        opacity: 0,
        duration: 0.8,
        stagger: 0.1,
        ease: "expo.in"
      }, "+=0.2");

      tl.to("#loader-bar-container", {
        opacity: 0,
        duration: 0.3
      }, "-=0.5");

      // 5. Shutter Reveal (Cinematic Slide)
      tl.to("#shutter-top", {
        yPercent: -100,
        duration: 1.2,
        ease: "power4.inOut"
      }, "+=0.1");

      tl.to("#shutter-bottom", {
        yPercent: 100,
        duration: 1.2,
        ease: "power4.inOut"
      }, "<"); // Starts at same time as shutter-top

      // 6. Reveal Dashboard Elements
      tl.to(".main-dashboard", {
        opacity: 1,
        duration: 1
      }, "-=0.8");

      tl.to(".dashboard-element", {
        opacity: 1,
        y: 0,
        duration: 1,
        stagger: 0.15,
        ease: "power3.out"
      }, "-=0.5");

      // Cleanup preloader from DOM after transition
      tl.set("#preloader", { display: "none" });
    });
  </script>
<!-- END: Animation Scripts -->
</body></html>
